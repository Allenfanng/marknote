[package]
name = "marknote"
version = "1.2.5"
description = "A Typora-like Markdown editor"
authors = ["Allen"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
rfd = "0.16"
percent-encoding = "2.3"
open = "5"
tauri-plugin-single-instance = "2"
